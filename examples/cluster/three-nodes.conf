# 三节点、两个逻辑分片的示例拓扑。
#
# 同一份文件可以被三个节点共用，各自用 --cluster-self 指明自己是谁：
#   ./mini_redis_server --port 7001 --cluster-config examples/cluster/three-nodes.conf --cluster-self n1
#   ./mini_redis_server --port 7002 --cluster-config examples/cluster/three-nodes.conf --cluster-self n2
#   ./mini_redis_server --port 7003 --cluster-config examples/cluster/three-nodes.conf --cluster-self n3
#
# 之后用任意 cluster-aware 客户端连接，例如：
#   redis-cli -c -p 7001 set '{user:42}:profile' alice
#   redis-cli -p 7001 cluster slots
#   redis-cli -p 7001 cluster keyslot '{user:42}:orders'

self n1
epoch 1

# node <node-id> <client-host> <client-port>
node n1 127.0.0.1 7001
node n2 127.0.0.1 7002
node n3 127.0.0.1 7003

# 每个 shard 是一个 Raft group，三个节点互为 voter。
# 16384 个 slot 只分成 2 个 group，因此只有 2 套选举定时器和 WAL。
shard 1 n1 n2 n3
shard 2 n2 n3 n1

# 把 16384 个 slot 按声明顺序均分：shard 1 拿 0-8191，shard 2 拿 8192-16383。
auto-slots

# leader <shard-id> <node-id> <term> [lease-ms]
# 省略 lease-ms 表示该 hint 不过期，便于静态演示；
# 真实部署由各 group leader 带 term 的心跳周期性刷新。
leader 1 n1 1
leader 2 n2 1

# 迁移窗口示例：把 slot 866（"hello" 所在的 slot）从 shard 1 交给 shard 2。
# ready 表示源分片已提交 TargetReady(proof)，ASK 窗口打开。
# migrating 866 1 2 ready
